{% extends 'base.html' %}

{% block title %}POSTS{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title text-center mb-4">{{ post["title"] }}</h1>
            <p class="card-text">{{ post.get('content') }}</p>
            <a href="{{ url_for('posts.get_posts') }}" class="btn btn-primary mt-3">
                Return to Posts
            </a>
        </div>
    </div>
</div>
{% endblock %}
