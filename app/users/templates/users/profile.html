{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<style>
.profile-header {
    background-color: #5a9df2;
    color: #ffffff;
    padding: 15px;
    text-align: center;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.profile-header span {
    font-weight: 600;
    font-size: 1.1em;
}

.cookie-section {
    margin-bottom: 25px;
    padding: 15px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05); /* Легка тінь */
    background-color: #fafafa;
}

.cookie-section h2 {
    color: #5a9df2;
    font-size: 1.3em;
    font-weight: 600;
}

.cookie-section form input[type="text"],
.cookie-section form input[type="number"] {
    padding: 10px;
    margin: 8px 0;
    width: calc(33.333% - 16px);
    box-sizing: border-box;
    border-radius: 6px;
    border: 1px solid #ced4da;
    background-color: #f9f9f9;
}

.cookie-section form button {
    padding: 10px 20px;
    background-color: #4caf50;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.cookie-section .delete-all-btn {
    background-color: #e57373;
    margin-top: 10px;
    font-weight: bold;
}

.cookie-section form button:hover {
    background-color: #45a049;
}

.cookie-section .delete-all-btn:hover {
    background-color: #d32f2f;
}

.profile-container {
    max-width: 750px;
    margin: 0 auto;
    padding: 25px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
}

.logout-btn {
    display: inline-block;
    margin-top: 10px;
    color: #ffffff;
    background-color: #f44336;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
}

.cookie-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.profile-header h1 {
    margin: 0;
    font-size: 1.6em;
}

.cookie-table th,
.cookie-table td {
    padding: 12px;
    border: 1px solid #e0e0e0;
    text-align: left;
    font-size: 0.95em;
}

.cookie-table th {
    background-color: #f5f5f5;
    font-weight: 600;
}

</style>

<div class="profile-container">
    <header class="profile-header">
        <h1>Ласкаво просимо до сторінки <span>{{ username }}</span></h1>
        <a class="logout-btn" href="{{ url_for('user_name.logout') }}">Вийти</a>
    </header>

    <section class="cookie-section">
        <h2>Додати куку:</h2>
        <form method="post">
            <input type="text" name="cookie_key" placeholder="Ключ куки" required>
            <input type="text" name="cookie_value" placeholder="Значення куки" required>
            <input type="number" name="cookie_expiry" placeholder="Термін дії (в секундах)" required>
            <button type="submit" name="action" value="add">Додати куку</button>
        </form>
    </section>

    <section class="cookie-section">
        <h2>Видалити куку:</h2>
        <form method="post">
            <input type="text" name="cookie_key" placeholder="Ключ куки для видалення" required>
            <button type="submit" name="action" value="delete">Видалити куку за ключем</button>
        </form>
    </section>

    <section class="cookie-section">
        <h2>Список всіх кук:</h2>
        <table class="cookie-table">
            <tr>
                <th>Ключ</th>
                <th>Значення</th>
            </tr>
            {% for key, value in cookies.items() %}
            <tr>
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
            {% endfor %}
        </table>
        <form method="post">
            <button type="submit" name="action" value="delete_all" class="delete-all-btn">Видалити всі куки</button>
        </form>
    </section>
</div>
{% endblock %}
